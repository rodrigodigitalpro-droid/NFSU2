# NFSU2 Remaster - RTX Remix baseline config
#
# Copy next to speed2.exe. Every option below exists in RtxOptions.md of both
# the remix-1.5.2 release and dxvk-remix main (checked 2026-10-07).
# Settings precedence: user.conf overrides this file, and any in-game quality
# preset other than "Custom" overrides both (documentation/RemixConfig.md).
#
# Camera/scene values are the ones the community NFSU2 Remix config proved
# out (github.com/Ekozmaster/NFSU2-RTX-Remix, rtx-remix-defaults/rtx.conf).
# Texture hash lists (rtx.uiTextures, rtx.skyBoxTextures, rtx.ignoreTextures,
# rtx.decalTextures, rtx.particleTextures, rtx.postfx.motionBlurMaskOutTextures,
# ...) are tagged in-game from the Remix "Game Setup" tab and appended to this
# file; see docs/BLUEPRINT.md section 4.1.

# --- Camera and scene -------------------------------------------------------
# NFSU2 hands D3D9 a fused world-view matrix (2 = World).
rtx.fusedWorldViewMode = 2
rtx.zUp = True
# sceneScale = 1 cm / game unit; NFSU2 units are metres.
rtx.sceneScale = 0.01
# Game units an object may move in one frame and still be "the same" object.
# A car at 300 km/h covers ~1.4 m per 60 Hz frame; 4 m leaves headroom for
# frame-time spikes without merging nearby traffic.
rtx.uniqueObjectDistance = 4
# The sky dome is drawn in the first draw calls of every frame.
rtx.skyDrawcallIdThreshold = 8

# --- Draw-call routing -------------------------------------------------------
# The community config ray traces NFSU2 through its fixed-function transforms.
# Flip both to True only to investigate geometry that is missing from captures.
rtx.useVertexCapture = False
rtx.useWorldMatricesForShaders = False
# The original env-map cubemaps are replaced by path-traced reflections.
rtx.allowCubemaps = False

# --- Culling ------------------------------------------------------------------
# NFSU2 culls aggressively, so off-screen buildings vanish from reflections
# and light pops in. Keep anti-culling on, but bounded: every extra object
# kept alive is an extra BVH instance. Tune numObjectsToKeep while profiling.
rtx.antiCulling.object.enable = True
rtx.antiCulling.object.farPlaneScale = 10
rtx.antiCulling.object.numObjectsToKeep = 10000
rtx.antiCulling.light.enable = True
rtx.antiCulling.light.numFramesToExtendLightLifetime = 600

# --- Lighting -----------------------------------------------------------------
# Neural Radiance Cache for indirect light (2 = NRC): infinite bounces at a
# lower cost than ReSTIR GI on multi-bounce paths such as wet night streets.
rtx.integrateIndirectMode = 2

# --- Latency and frame pacing (see docs/FRAME-PACING.md) -----------------------
# The simulation is capped at 60 by WidescreenFix (FPSLimit = 60). DLSS Frame
# Generation multiplies the displayed rate; Reflex pulls latency back down.
rtx.isReflexEnabled = True
# 1 = Low Latency, 2 = Low Latency + Boost (use 2 if the CPU is the bottleneck).
rtx.reflexMode = 1
rtx.dlfg.enable = True
# Generated frames per rendered frame: 1 = 2x (120 Hz), 3 = 4x (240 Hz, RTX 50).
# remix-1.5.2 accepts 1-4; dxvk-remix main/CI builds accept up to 6.
rtx.dlfg.maxInterpolatedFrames = 1
rtx.dlfg.enablePresentMetering = True

# --- Streaming and memory -----------------------------------------------------
# Required to load RTX IO (.pkg, GPU-decompressed) packaged assets; harmless
# with loose files during development.
rtx.io.enabled = True
# Replacement textures above this share of free VRAM load at reduced mip
# levels instead of overflowing; tools/texture_budget.py keeps the set small
# enough that this rarely triggers on 12 GB cards.
rtx.texturemanager.budgetPercentageOfAvailableVram = 50
