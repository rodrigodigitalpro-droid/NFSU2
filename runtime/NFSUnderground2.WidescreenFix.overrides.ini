; Values to change in ThirteenAG's scripts/NFSUnderground2.WidescreenFix.ini
; (release "nfsu2", github.com/ThirteenAG/WidescreenFixesPack). Only the keys
; listed here differ from the shipped defaults; leave everything else as is.
; With RTX Remix, rename the fix's dinput8.dll to dsound.dll (community-proven
; load order, see github.com/Ekozmaster/NFSU2-RTX-Remix).

[MISC]
SkipIntro = 1
; 4 = Borderless Fullscreen. Avoids fullscreen-exclusive particle lag and is
; the mode the community Remix setups use.
WindowedMode = 4
; Lock the simulation at 60. Physics, gear changes and NOS trail length are
; tied to frame rate, so frames above 60 come from DLSS Frame Generation.
FPSLimit = 60
HighFPSCutscenes = 1
; Default 1 prevents crashes. If the game hangs at startup on Windows 11 24H2
; (WidescreenFixesPack issues #1573, #1748), try 0.
SingleCoreAffinity = 1

[NOSTrail]
FixNOSTrailLength = 1
